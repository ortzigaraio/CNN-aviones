[project]
name = "avion-osint"
version = "0.1.0"
description = "Detección y clasificación de aviones en ortofotos, contrastada con ADS-B y noticias públicas (análisis retrospectivo)."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "dvc",
]
geo = [
    "rasterio>=1.5.2",
]
vision = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.214",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avion_osint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
# Ruff formatea también los bloques de código de los Markdown; los de docs/ son
# firmas ilustrativas de las especificaciones y no se tocan.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# PyTorch solo para CPU en el grupo «vision» (sin las ruedas de CUDA, que ocupan varios GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
