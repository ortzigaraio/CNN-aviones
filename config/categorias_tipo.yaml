# Tipo OACI de aeronave -> categoría por longitud (docs/specs/fase-1b.md, sección 3).
#
# Umbrales de la spec: ligero < 20 m · regional 20-30 m · pasillo_unico 30-45 m ·
# fuselaje_ancho > 45 m. La categoría se asigna SOLO por la longitud total, aunque el
# nombre no case con el uso comercial del avión (p. ej. un Embraer 190 o un Q400 salen
# como pasillo_unico; un B757, de pasillo único, sale como fuselaje_ancho; un
# Gulfstream IV, reactor de negocios, sale como regional).
#
# AVISO: las longitudes salen del conocimiento de quien escribió este fichero y NO
# están contrastadas con una fuente (fichas del fabricante, EASA o similar). Antes de
# dar resultados definitivos hay que verificarlas, sobre todo las cercanas a un umbral
# (marcadas con «cerca del umbral»).
#
# Lista: solo tipos habituales en aeropuertos españoles (aerolíneas, carga y aviación
# general/negocios). Un tipo que no esté aquí se trata como «desconocido».

